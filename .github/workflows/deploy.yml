name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published, but never queue
# more than one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript types without a flag, which is how the DSP tests run.
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # 16 checks over the DSP core: FFT against a naive DFT, Parseval, window sums,
        # reassignment placement, NSDF octave robustness, BS.1770-4 coefficients.
        run: npm test

      - name: Build
        # Runs `tsc --noEmit` before `vite build`, so a type error fails the deploy.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
