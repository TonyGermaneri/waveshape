<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Real-time audio waveform and spectral analysis on WebGPU compute shaders."
    />
    <title>Waveshape</title>

    <!--
      Installed as an app: the manifest names it and sizes its icons, and the theme colour is
      the panel's own so the window chrome around a standalone launch matches what it frames.
      `apple-*` are the same declarations again for a platform that never adopted the manifest.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="application-name" content="Waveshape" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Waveshape" />
    <!-- Lets the canvas run under the status bar, which `viewport-fit=cover` already assumes. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      Restores cross-origin isolation (and therefore SharedArrayBuffer) on static hosts that
      cannot set COOP/COEP headers, such as GitHub Pages, and serves the app offline once it
      has been seen. No-ops on the headers when the server already sends them. Must run before
      the module so the reload happens before any audio work starts.
    -->
    <script src="./sw.js"></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
